name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test "tests/**/*.test.js"

  deploy:
    # Deploy site/ to GitHub Pages on every push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate site/js/config.js from repository secrets
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          if [ -z "$OAUTH_CLIENT_ID" ] || [ -z "$SPREADSHEET_ID" ]; then
            echo "::error::Repository secret OAUTH_CLIENT_ID and/or SPREADSHEET_ID is missing or empty. Set both under Settings -> Secrets and variables -> Actions. Refusing to deploy a placeholder config.js."
            exit 1
          fi
          cat > site/js/config.js <<EOF
          // Generated at deploy time from GitHub Actions secrets — do not edit.
          export const CLIENT_ID = "$OAUTH_CLIENT_ID";
          export const SPREADSHEET_ID = "$SPREADSHEET_ID";
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
